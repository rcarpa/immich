# Application identity.
#
# immich-sync fork. The counterpart of `ios/Signing.xcconfig`, and for the same
# reason: upstream's value names *upstream's* namespace, and a build that keeps it
# is claiming to be Immich.
#
# Create `Identity.local.properties` beside this file overriding each value to
# provide your own:
#     applicationId = me.yourname.mirrich
#
# Use the reverse of a domain you control. `app.alextran` is the reverse of the
# Immich author's own `alextran.app`, so it is his to use and not ours; the
# reverse of `example.me` is `me.example`, with no `app.` in front of it.
#
# **This is a one-way door.** Android identifies an app by this string, so
# changing it after installing gives you a *different* app: empty database, and
# the whole offline mirror downloads again. It also decides whether this build can
# sit beside upstream's on the same phone — with upstream's value it cannot, and
# installing over a differently-signed Immich fails outright.

# Root application id for the Release build type.
# `.debug` is appended for the Debug build type.
applicationId = app.alextran.immich
